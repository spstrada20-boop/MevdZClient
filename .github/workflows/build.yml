name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'zulu'

    - name: Setup Legacy Gradle 2.14.1
      run: |
        wget https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
        unzip -q gradle-2.14.1-bin.zip
        echo "$GITHUB_WORKSPACE/gradle-2.14.1/bin" >> $GITHUB_PATH

    - name: Build Mod with Gradle
      run: |
        if [ -d "./MevdZClient" ]; then
          cd ./MevdZClient
        fi
        gradle build -x test --no-daemon

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: MevdZClient-Mod-Jar
        path: |
          **/build/libs/*.jar
